services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: codeatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codeatlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codeatlas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codeatlas-network

  adminer:
    image: docker.io/library/adminer:latest
    container_name: codeatlas-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codeatlas-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeatlas-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-codeatlas}"
      PROJECT_NAME: "CodeAtlas API"
      VERSION: "0.1.0"
      API_V1_STR: "/api/v1"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:Z
      - ./backend/alembic:/app/alembic:Z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codeatlas-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: codeatlas-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/frontend/src:Z
      - ./frontend/public:/app/frontend/public:Z
      - ./packages/contracts:/app/packages/contracts:Z
    depends_on:

      - backend
    networks:
      - codeatlas-network

volumes:
  postgres_data:

networks:
  codeatlas-network:
    driver: bridge
